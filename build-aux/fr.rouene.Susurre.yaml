id: fr.rouene.Susurre
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: susurre

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Model downloads from Hugging Face
  - --share=network
  # Microphone (pipewire-pulse)
  - --socket=pulseaudio
  # Notification area icon (AppIndicator extension)
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Change" on the shortcut row opens Settings › Apps › Susurre
  - --talk-name=org.gnome.Settings
  # IBus engine: the private bus socket, and the file naming its address.
  # This is what lets dictation insert text the keyboard layout cannot type.
  - --filesystem=xdg-cache/ibus
  - --filesystem=xdg-config/ibus:ro
  # GlobalShortcuts, RemoteDesktop and Background go through
  # xdg-desktop-portal, reachable by default. No extra permission needed.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/susurre/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

# Both modules build offline: every crate and every wheel is a source with a
# pinned sha256, so the build has no network and no unpinned dependency.
# Regenerate the two generated files with ./build-aux/update-vendor.sh after
# touching Cargo.lock or the faster-whisper version.
modules:
  - python3-faster-whisper.yaml

  - name: susurre
    buildsystem: simple
    build-commands:
      # --offline so a crate missing from the vendor tree fails here instead of
      # silently reaching the network.
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release --features vulkan
      - install -Dm755 target/release/susurre /app/bin/susurre
      - install -Dm755 python/susurre-ct2.py /app/libexec/susurre-ct2.py
      - install -Dm644 data/fr.rouene.Susurre.desktop
        /app/share/applications/fr.rouene.Susurre.desktop
      - install -Dm644 data/fr.rouene.Susurre.metainfo.xml
        /app/share/metainfo/fr.rouene.Susurre.metainfo.xml
      - install -Dm644 data/fr.rouene.Susurre.svg
        /app/share/icons/hicolor/scalable/apps/fr.rouene.Susurre.svg
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - .cargo-sdk
          - build
          - repo
          - target
          - susurre.flatpak
      # Unpacks every crate under cargo/vendor and writes the cargo config that
      # redirects crates-io to it. Listed after the directory so a stale vendor
      # tree in the checkout cannot shadow it.
      - cargo-sources.json
